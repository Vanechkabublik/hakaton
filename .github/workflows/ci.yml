name: CI

on:
  push:
    branches: [main, master, "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP (lint + тесты)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: news_test
          POSTGRES_USER: news
          POSTGRES_PASSWORD: news
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U news -d news_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_ENV: testing
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: news_test
      DB_USER: news
      DB_PASSWORD: news
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_pgsql, gd, intl, mbstring, sodium, curl, dom, bcmath, gmp, pcntl, zip
          coverage: none
          tools: composer:v2

      - name: Кэш Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer validate --no-check-publish
      - run: composer install --no-interaction --no-progress --prefer-dist

      - name: Синтаксис PHP
        run: composer lint

      - name: Тесты
        run: vendor/bin/phpunit

  docker:
    name: Docker (сборка + конфигурация)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: compose-файл валиден
        run: |
          cp .env.example .env
          sed -i 's/^ACME_EMAIL=$/ACME_EMAIL=ops@example.com/; s/^DB_PASSWORD=$/DB_PASSWORD=ci-password/' .env
          docker compose config --quiet

      - name: Caddyfile валиден
        run: |
          docker run --rm \
            -e DOMAIN=news.example.com -e ACME_EMAIL=ops@example.com \
            -e ACME_CA=https://acme-staging-v02.api.letsencrypt.org/directory \
            -v "$PWD/docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

      - name: deploy.sh — синтаксис
        run: bash -n deploy.sh

      - uses: docker/setup-buildx-action@v3

      - name: Сборка образа приложения
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          push: false
          load: true
          tags: news-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Образ содержит нужные расширения и pg_dump
        run: |
          docker run --rm --entrypoint php news-app:ci -r '
            foreach (["pdo_pgsql","gd","intl","sodium","mbstring","curl","dom","Zend OPcache","pcntl","zip","bcmath","gmp"] as $e) {
              if (!extension_loaded($e)) { fwrite(STDERR, "нет расширения $e\n"); exit(1); }
            }
            $info = gd_info();
            if (empty($info["WebP Support"]) || empty($info["JPEG Support"])) { fwrite(STDERR, "gd без WebP/JPEG\n"); exit(1); }
          '
          docker run --rm --entrypoint pg_dump news-app:ci --version

  stack:
    name: Стек целиком (docker compose up)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Подготовить .env для localhost (Caddy выпустит локальный сертификат)
        run: |
          cp .env.example .env
          sed -i \
            -e 's|^DOMAIN=.*|DOMAIN=localhost|' \
            -e 's|^APP_URL=.*|APP_URL=https://localhost|' \
            -e 's|^ACME_EMAIL=.*|ACME_EMAIL=ci@example.com|' \
            -e 's|^DB_PASSWORD=.*|DB_PASSWORD=ci-password|' \
            -e "s|^APP_KEY=.*|APP_KEY=base64:$(openssl rand -base64 32)|" \
            -e 's|^ADMIN_EMAIL=.*|ADMIN_EMAIL=admin@example.test|' \
            -e 's|^ADMIN_PASSWORD=.*|ADMIN_PASSWORD=CiAdminPass2026|' \
            .env

      - name: Собрать и поднять стек (миграции применяются при старте)
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Сайт отвечает по HTTPS
        run: |
          for path in / /robots.txt /sitemap.xml /rss.xml /login /subscribe /assets/css/app.css /assets/js/core.js /sw.js; do
            code=$(curl -ksS --retry 10 --retry-delay 3 --retry-all-errors -o /dev/null -w '%{http_code}' "https://localhost${path}")
            echo "${path} -> ${code}"
            [ "${code}" = "200" ] || exit 1
          done
          curl -ksS https://localhost/ | grep -q 'Новости'
          # HTTP редиректит на HTTPS
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://localhost/)" = "308"
          # скрытые файлы и несуществующие страницы не отдаются
          test "$(curl -ksS -o /dev/null -w '%{http_code}' https://localhost/.env)" = "404"
          test "$(curl -ksS -o /dev/null -w '%{http_code}' https://localhost/no-such-page)" = "404"

      - name: Миграции и начальные данные применены, администратор создан
        run: |
          docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "select count(*) from migrations"' | grep -qv '^0$'
          docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "select role from users where email = '"'"'admin@example.test'"'"'"' | grep -q admin
          docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "select count(*) from plans"' | grep -q '^4$'

      - name: Воркер работает, консоль и бэкап доступны
        run: |
          docker compose exec -T app console schedule:run
          docker compose exec -T app console backup
          docker compose exec -T app sh -c 'ls storage/backups/*.sql.gz'

      - name: Логи при падении
        if: failure()
        run: docker compose ps -a; docker compose logs --tail=120
