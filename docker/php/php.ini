; Продакшн-настройки PHP (подключается как conf.d/zz-app.ini)
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
html_errors = Off
zend.assertions = -1

memory_limit = 256M
max_execution_time = 60
max_input_time = 60

; Загрузка медиа (лимит приложения — 12 МБ на файл)
file_uploads = On
upload_max_filesize = 16M
post_max_size = 20M
max_file_uploads = 20

; Код в образе неизменяем: проверку mtime файлов отключаем, перезапуск контейнера сбрасывает кэш
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Сессии хранит само приложение (PostgreSQL), нативные не используются
session.auto_start = 0

serialize_precision = -1
