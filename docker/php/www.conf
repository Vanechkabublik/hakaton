; Пул php-fpm
[www]
user = www-data
group = www-data

; FastCGI на всех интерфейсах контейнера; наружу порт не публикуется — его видит только Caddy в сети compose
listen = 9000

; Переменные окружения контейнера (APP_KEY, DB_*, …) должны попадать в PHP
clear_env = no

; stdout/stderr воркеров — в лог контейнера
catch_workers_output = yes
decorate_workers_output = no

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Эндпоинт для healthcheck контейнера (доступен только по FastCGI внутри сети compose)
ping.path = /ping
ping.response = pong

request_terminate_timeout = 120s
