; Пул php-fpm. Остальное (listen = 9000, clear_env = no, логи в stderr) задают docker.conf и zz-docker.conf образа.
[www]
user = www-data
group = www-data

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Эндпоинт для healthcheck контейнера (доступен только по FastCGI внутри сети compose)
ping.path = /ping
ping.response = pong

request_terminate_timeout = 120s
