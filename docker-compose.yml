# Стек: Caddy (авто-HTTPS) → php-fpm (app) + воркер очереди/планировщика (worker) → PostgreSQL (db).
# Запуск: ./deploy.sh (или вручную: cp .env.example .env && docker compose up -d --build)
name: news

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app-environment: &app-environment
  DB_HOST: db
  DB_PORT: "5432"
  DB_NAME: ${DB_NAME:-news}
  DB_USER: ${DB_USER:-news}
  DB_PASSWORD: ${DB_PASSWORD:?Задайте DB_PASSWORD в .env}

x-app: &app
  build:
    context: .
    target: app
  image: news-app:latest
  env_file: .env
  restart: unless-stopped
  logging: *logging
  networks: [internal]
  volumes:
    - uploads:/var/www/html/storage/uploads
    - backups:/var/www/html/storage/backups
    - logs:/var/www/html/storage/logs

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    networks: [internal]
    shm_size: 256mb
    environment:
      POSTGRES_DB: ${DB_NAME:-news}
      POSTGRES_USER: ${DB_USER:-news}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Задайте DB_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # php-fpm; при старте применяет миграции и создаёт начальные данные (идемпотентно)
  app:
    <<: *app
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: "1"
    depends_on:
      db:
        condition: service_healthy

  # Очередь писем/push/рассылок и планировщик (публикация по расписанию, автопродление, дайджесты, бэкапы)
  worker:
    <<: *app
    command: ["console", "worker"]
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f '[b]in/console worker' > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      <<: *app-environment
    depends_on:
      app:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    networks: [internal]
    # HTTP_BIND/HTTPS_BIND: порт или адрес:порт на хосте. По умолчанию 80/443; в режиме «за вашим веб-сервером»
    # (./deploy.sh --behind-proxy) — только локальные порты, чтобы не конфликтовать с другим сайтом на сервере.
    command: ["caddy", "run", "--config", "/etc/caddy/${CADDYFILE:-Caddyfile}", "--adapter", "caddyfile"]
    ports:
      - "${HTTP_BIND:-80}:80"
      - "${HTTPS_BIND:-443}:443"
      - "${HTTPS_BIND:-443}:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Задайте DOMAIN в .env}
      ACME_EMAIL: ${ACME_EMAIL:?Задайте ACME_EMAIL в .env}
      ACME_CA: ${ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
    volumes:
      - ./docker/caddy:/etc/caddy:ro
      - ./public:/var/www/html/public:ro
      - uploads:/var/www/html/storage/uploads:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

networks:
  internal:

volumes:
  pgdata:
  uploads:
  backups:
  logs:
  caddy_data:
  caddy_config:
